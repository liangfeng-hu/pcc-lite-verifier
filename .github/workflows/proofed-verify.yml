name: Proofed verification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proofed-verify:
    name: proofed-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current subject
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify current code and emit completion receipt
        uses: liangfeng-hu/proofed@v0.1.0-alpha.2
